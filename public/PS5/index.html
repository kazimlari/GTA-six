<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fullscreen Video</title>
  <script src="https://fast.wistia.com/player.js" async></script>
  <script src="https://fast.wistia.com/embed/u5nqh97lt7.js" async type="module"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .video-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      cursor: pointer;
    }

    wistia-player[media-id='u5nqh97lt7']:not(:defined) {
      background: center / contain no-repeat url('https://fast.wistia.com/embed/medias/u5nqh97lt7/swatch');
      display: block;
      width: 100%;
      height: 100%;
      filter: blur(5px);
    }

    wistia-player {
      display: block;
      width: 100%;
      height: 100%;
      /* Prevents hover toolbars and click-to-pause overlays */
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="video-stage" id="stage">
    <wistia-player
      id="video"
      media-id="u5nqh97lt7"
      autoplay
      muted
      silent-autoplay="allow"
      fit-strategy="contain"
      end-video-behavior="loop"
      big-play-button="false"
      controls-visible-on-load="false"
      play-bar-control="false"
      play-pause-control="false"
      volume-control="false"
      settings-control="false"
      fullscreen-control="false"
      copy-link-and-thumbnail="false"
      wistia-branding="false"
    ></wistia-player>
  </div>

  <script>
    const stage = document.getElementById("stage");
    const player = document.getElementById("video");

    // Click anywhere to enter true OS fullscreen and unmute audio
    stage.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        stage.requestFullscreen?.().catch(() => {});
      }
      if (player) {
        player.muted = false;
        player.play?.();
      }
    });
  </script>
</body>
</html>
